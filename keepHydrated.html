<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Hydrated</title>
</head>
<body>
    <script>
        function KeepHydrated(time) {
            let litters = 0.5 * time
            return Math.floor(litters)
        }
        console.log(KeepHydrated(1))
        console.log(KeepHydrated(4))
        console.log(KeepHydrated(10))
    </script>
</body>
</html>
