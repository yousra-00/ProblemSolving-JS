<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Number To Reversed Array</title>
</head>
<body>
    <script>
        function ConvertNumberToReversedArray(number) {
            
            return String(number).split("").map((el)=> {
                return +el
            }).reverse()
        }
        console.log(ConvertNumberToReversedArray(12443))
    </script>
</body>
</html>
