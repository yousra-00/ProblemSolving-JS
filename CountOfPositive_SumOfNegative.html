<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Of Positive_SumOfNegative</title>
</head>
<body>
    <script>
        function CountOfPositive_SumOfNegative(arr) {
          let positivearr =arr.filter((el)=> {
                return el >0 
            })
           let NegativeArr = arr.filter((el)=> {
            return el<0
           }).reduce((acc,current)=> {
            return acc+current
           },0)
           return [positivearr.length,NegativeArr]
        }
        console.log(CountOfPositive_SumOfNegative([1,2,3,-5,0,-7]))
    </script>
</body>
</html>
