<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Positive</title>
</head>
<body>
    <script>
        function SumOfPositive(arr) {
            let sum=0
            for(let i=0;i<arr.length;i++) {
                if(arr[i]>0) {
                    sum+=arr[i]
                }
            }
           return sum

           //another solution
           return arr.filter((x)=> x>0).reduce((acc,current)=>acc+current,0)
        }
        console.log(SumOfPositive([91,-2,-13]))
    </script>
</body>
</html>
