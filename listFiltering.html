<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List filtering</title>
</head>
<body>
    <script>
        function listfiltering(arr) {
            return arr.filter((el)=> {
                return typeof el =="number"
            })
        }
        console.log(listfiltering(['yousra','y',11,2,33,44,true]))
    </script>
</body>
</html>
