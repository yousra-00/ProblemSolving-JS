<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert number to string and reverse</title>
</head>
<body>
    <script>
        function convertNumberToStrandreverse(input) {
           return typeof input =="number" ? String(input) : Number(input)
        }
        console.log(convertNumberToStrandreverse(123))
        console.log(convertNumberToStrandreverse("123"))
    </script>
</body>
</html>
