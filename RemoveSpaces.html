<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Spaces</title>
</head>
<body>
    <script>
        function RemoveSpace(str) {
            return str.split("").filter((el)=> {
                return el !=" "
            }).join("")
        }
        console.log(RemoveSpace("y  o usr    a"))
    </script>
</body>
</html>
