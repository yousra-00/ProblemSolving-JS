<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or odd</title>
</head>
<body>
    <script>
        function evenOrOdd(arr) {
            let sum = arr.reduce((current,acc)=> {
                return current + acc
            },0)
            return sum% 2 == 0? "Even" : "Odd"
        }
        console.log(evenOrOdd([1,2,3,4,5,5]))
        console.log(evenOrOdd([]))
    </script>
</body>
</html>
