<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are a square</title>
</head>
<body>
    <script>
        function square(num) {
           return Number.isInteger(Math.sqrt(num)) ? `square of ${num} is ${Math.sqrt(num)} ` : `The number ${num} hasn't a square`
        }
        console.log(square(25))
        console.log(square(27))
        console.log(square(2))
        console.log(square(4))
    </script>
</body>
</html>
