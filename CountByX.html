<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count By X</title>
</head>
<body>
    <script>
        function CountBy(x,n) {
            let result = []
            for(let i=1; i<=n ;i++) {
                result.push(x*i)
            }
            return result
        }

        console.log(CountBy(1,10))
        console.log(CountBy(1,2))
    </script>
</body>
</html>
