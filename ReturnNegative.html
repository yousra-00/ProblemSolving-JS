<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Negative</title>
</head>
<body>
    <script>
        function ReturnNegative(number) {
           return number>0 ? -number :number
        }
        console.log(ReturnNegative(-2))
        console.log(ReturnNegative(-5))
        console.log(ReturnNegative(6))
        console.log(ReturnNegative(10))
        console.log(ReturnNegative(0))
    </script>
</body>
</html>
