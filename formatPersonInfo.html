<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formatPersonInfo</title>
</head>
<body>
    <script>
        function formatPersonInfo(obj) {
            return `My name is ${obj.name}, I am ${obj.age} years old , I am Student at ${obj.faculty} and I live in ${obj.country}`
        }
        console.log(formatPersonInfo({
            name:"Yousra",
            age:21,
            country:"Egypt",
            faculty:'computer science'
        }))
    </script>
</body>
</html>
