<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a needle</title>
</head>
<body>
    <script>
        function findneedle(arr) {
            for(let i=0;i<arr.length;i++) {
               if(arr[i] == "needle") {
                return `needle is at position ${i}`
               }
            }
        }
        console.log(findneedle(["yousra","yousef","hello","needle"]))
        console.log(findneedle(["needle","yousra","yousef","hello"]))
        console.log(findneedle(["yousra","yousef","needle","hello"]))
        console.log(findneedle(["yousra","yousef","hello"]))
    </script>
</body>
</html>
