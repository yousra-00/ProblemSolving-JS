<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who likes it</title>
</head>
<body>
    <script>
        function whoLikesit(names) {
            if(names.length == 0) {
                return `No one likes it`
            }else if(names.length == 1) {
                return `${names[0]} likes the post`
            }else if(names.length == 2) {
                return `${names[0]} and ${names[1]} like the post`
            }else {
                return `${names[0]} and ${names.length - 1} like the post`
            }
        }
        console.log(whoLikesit([]))
        console.log(whoLikesit(["yousra"]))
        console.log(whoLikesit(["yousra","yousef"]))
        console.log(whoLikesit(["yousra","yousef","ahmed"]))
        console.log(whoLikesit(["yousra","yousef","ahmed","noor"]))
        console.log(whoLikesit(["yousra","yousef","ahmed","noor","ali","mohammed"]))
    </script>
</body>
</html>
