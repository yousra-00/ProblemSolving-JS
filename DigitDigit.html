<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Digits</title>
</head>
<body>
    <script>
        function squareDigits(num) {
            let strNum = String(num)
            let newNumbers= strNum.split("").map((n)=>{
                return +n * +n
            }).join("")
            return Number(newNumbers)
        }
        console.log(squareDigits(123))
    </script>
</body>
</html>
