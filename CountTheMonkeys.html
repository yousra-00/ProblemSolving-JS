<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count the monkeys</title>
</head>
<body>
    <script>
        function countMonkeys(n) {
            let arr=[]
            for(let i=1;i<=n;i++) {
                arr.push(i)
            }
            return arr
        }
        console.log(countMonkeys(10))
        console.log(countMonkeys(0))
        console.log(countMonkeys(4))
    </script>
</body>
</html>
