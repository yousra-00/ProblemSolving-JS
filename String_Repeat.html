<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String_Repeat</title>
</head>
<body>
    <script>
        function String_Repeat(number,string) {
            return string.repeat(number)
        }
        console.log(String_Repeat(3,"hello"))
        console.log(String_Repeat(2,"yousra"))
        console.log(String_Repeat(0,"hello"))
    </script>
</body>
</html>
