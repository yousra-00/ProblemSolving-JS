<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the odd int</title>
</head>
<body>
    <script>
        function FindtheOddint(arr) {
           let oddint= arr.reduce((a,b)=> {
                return a^b
            },0)
            return oddint
        }
        console.log(FindtheOddint([1,1,2,3,4,4,2,3,3]))
    </script>
</body>
</html>
