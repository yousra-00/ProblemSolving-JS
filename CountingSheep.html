<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Sheep</title>
</head>
<body>
    <script>
        function CountingSheep(arr) {
            let counter = 0;
            arr.map((el)=> {
                if(el == true) {
                    counter++
                }
            
            })
            return counter
        }
        console.log(CountingSheep([true,false,true]))
    </script>
</body>
</html>
