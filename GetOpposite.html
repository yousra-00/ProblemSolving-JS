<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Opposite</title>
</head>
<body>
    <script>
        function getOpposite(number) {
            return -number
        }
        console.log(getOpposite(1))
        console.log(getOpposite(-2))
    </script>
</body>
</html>
