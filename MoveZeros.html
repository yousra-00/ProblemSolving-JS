<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Zeros</title>
</head>
<body>
    <script>
        function MoveZeros(arr){
            let zeros = arr.filter((el) => {
                return el == 0
            })
            let notZeros = arr.filter((el)=> {
                return el != 0
            })
            let mergeArrays = [...notZeros , ...zeros]
            return mergeArrays
        }
        console.log(MoveZeros([1,2,0,4,0,5,0,4,6,7]))
        console.log(MoveZeros([1,"yousra",0,"y",0,5,0,4,6,7]))
    </script>
</body>
</html>
