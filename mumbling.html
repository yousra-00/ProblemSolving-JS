<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbling</title>
</head>
<body>
    <script>
        function mumbling(s) {
            let result = []
            for(let i=0 ; i< s.length ; i++) {
                if(i==0) {
                   
                    result.push(s[i].toUpperCase())

                }else {
                    result.push(s[i].toUpperCase() + s[i].repeat(i))
                }
            }
            return result.join("-")
        }
        console.log(mumbling("yousra"))
    </script>
</body>
</html>
