<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>isogram</title>
</head>
<body>
    <script>
        function isIsogram(str) {
            return new Set(str.toLowerCase().split('')).size == str.length
        }
        console.log(isIsogram("yousra"))
        console.log(isIsogram("hello"))
    </script>
</body>
</html>
