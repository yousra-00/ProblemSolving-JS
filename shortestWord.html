<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortest word in the string</title>
</head>
<body>
    <script>
        function shortestWord(str) {
            let wordsLength = str.split(" ").map((el)=> {
                return el.length
            })
            return str.split(" ").map((el)=> {
                return el.length == Math.min(...wordsLength) ? el : null
            }).join(" ")
        }
        console.log(shortestWord("I'm Frontend Developer"))
        console.log(shortestWord("I'm cs student at mansoura university"))
    </script>
</body>
</html>
