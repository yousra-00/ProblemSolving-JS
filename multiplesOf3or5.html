<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum of muliples of 3 or 5</title>
</head>
<body>
    <script>
        function multipleOf3or5(number) {
            let numbers = []
            for(let i=1 ; i<number ; i++) {
                if(i % 3 == 0 || i % 5 ==0) {
                    numbers.push(i)
                }
            }
           return numbers.reduce((current,acc)=> {
            return current + acc
           })
        }
        console.log(multipleOf3or5(10))
    </script>
</body>
</html>
